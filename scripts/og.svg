<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Inter, Helvetica Neue, Arial, sans-serif">
  <title>barnard59 — Build data pipelines out of small pieces</title>

  <defs>
    <radialGradient id="indigo" cx="0.12" cy="0.05" r="0.8">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#4f46e5" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="teal" cx="0.92" cy="0.1" r="0.7">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#0e1017"/>
  <rect width="1200" height="630" fill="url(#indigo)"/>
  <rect width="1200" height="630" fill="url(#teal)"/>

  <!-- mark -->
  <g transform="translate(80 74)">
    <rect width="52" height="52" rx="12" fill="#4f46e5"/>
    <path d="M14 17 26 26l12-9M14 35 26 26" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" fill="none" opacity="0.5"/>
    <circle cx="13.5" cy="16" r="5" fill="#ffffff"/>
    <circle cx="13.5" cy="36" r="5" fill="#ffffff" opacity="0.6"/>
    <circle cx="26" cy="26" r="5.6" fill="#ffffff"/>
    <circle cx="38.5" cy="16" r="5" fill="#ffffff" opacity="0.6"/>
  </g>
  <text x="150" y="108" fill="#e9ebf0" font-size="30" font-weight="500" letter-spacing="-0.3">barnard59</text>

  <!-- headline -->
  <g font-family="Fraunces, Georgia, serif" font-weight="600" font-size="86" letter-spacing="-2">
    <text x="80" y="290" fill="#e9ebf0">Build data pipelines</text>
    <text x="80" y="386" fill="#e9ebf0">out of<tspan fill="#a5a5fb" dx="22">small pieces</tspan><tspan dx="8">.</tspan></text>
  </g>

  <!-- pipeline strip -->
  <g transform="translate(80 480)">
    <line x1="10" y1="10" x2="470" y2="10" stroke="#363c4d" stroke-width="2"/>
    <circle cx="10" cy="10" r="9" fill="#34d399"/>
    <circle cx="240" cy="10" r="9" fill="#a5a5fb"/>
    <circle cx="470" cy="10" r="9" fill="#fb7185"/>
    <text x="0" y="46" fill="#8a90a4" font-size="19">source</text>
    <text x="240" y="46" fill="#8a90a4" font-size="19" text-anchor="middle">transform</text>
    <text x="470" y="46" fill="#8a90a4" font-size="19" text-anchor="end">sink</text>
  </g>

  <text x="1120" y="536" fill="#8a90a4" font-size="20" text-anchor="end">Linked Data pipelines for Node.js</text>
</svg>
